[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarc-etl"
version = "0.1.0"
description = "Pipeline batch (INMET, IBGE, NASA POWER) que produz parquets para o zarc-app."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Angelo Santos"}]
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "responses>=0.25",
    "ruff>=0.5",
]

[project.scripts]
zarc-etl = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
