services:
  etl:
    build: .
    image: zarc-etl:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
    # Exemplos:
    #   docker compose run --rm etl inmet-stations
    #   docker compose run --rm etl all
    #   docker compose run --rm --entrypoint pytest etl -q
